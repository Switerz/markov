name: gograph

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: gograph-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-sqlite:////app/db/gograph.db}
    # CORS for frontend dev (vite at 5173 from host) — override via .env
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost,http://127.0.0.1:5173}
  volumes:
    # Mount source for hot reload (used by both profiles; harmless in prod)
    - ./gograph:/app/gograph
    - ./config.py:/app/config.py
    - ./extract.py:/app/extract.py
    - ./markov.py:/app/markov.py
    - ./roas.py:/app/roas.py
    - ./run.py:/app/run.py
    # SQLite file persistence (named volume — DB lives at /app/db/gograph.db)
    - gograph_db:/app/db
  ports:
    - "8000:8000"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    start_period: 15s
    retries: 5

services:
  backend:
    <<: *backend-base
    container_name: gograph-backend
    profiles: ["prod"]

  backend-dev:
    <<: *backend-base
    container_name: gograph-backend-dev
    command: ["python", "-m", "uvicorn", "gograph.backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles: ["dev"]

  frontend-dev:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    image: gograph-frontend:dev
    container_name: gograph-frontend-dev
    environment:
      VITE_API_BASE: "http://localhost:8000"
    volumes:
      - ./gograph/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev
    profiles: ["dev"]

  frontend-prod:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args:
        VITE_API_BASE: "/api"
    image: gograph-frontend:prod
    container_name: gograph-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["prod"]

  db:
    image: postgres:16-alpine
    container_name: gograph-db
    environment:
      POSTGRES_DB: gograph
      POSTGRES_USER: gograph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gograph}
    volumes:
      - gograph_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles: ["pg"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gograph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gograph_db:
  frontend_node_modules:
  gograph_pg:
